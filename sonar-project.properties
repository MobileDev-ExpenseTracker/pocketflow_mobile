sonar.projectKey=MobileDev-ExpenseTracker_pocketflow_mobile
sonar.organization=mobiledev-expensetracker
sonar.sources=src,App.tsx
sonar.tests=__tests__
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ── Exclusions ────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/__tests__/**,\
  **/*.d.ts,\
  **/assets/**,\
  **/.expo/**,\
  **/.expo-shared/**,\
  **/babel.config.js,\
  **/jest.config.js,\
  **/jest.setup.js

# ── Test inclusions  ──────────────────────────────────────────────────
sonar.test.inclusions=**/__tests__/**/*.test.tsx,**/__tests__/**/*.test.ts

# ── Language ──────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
